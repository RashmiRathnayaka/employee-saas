services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: employee_saas
      POSTGRES_PASSWORD: employee_saas
      POSTGRES_DB: employee_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # File storage doesn't need a container in dev - see docs/architecture.md
  # §6. The "local" StorageService driver (default) just uses a folder on
  # the API's own disk; MinIO was dropped as of Step 1.4 (licensing-change
  # pull restrictions, see the §6 history note).

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
