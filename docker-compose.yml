services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: employee_saas
      POSTGRES_PASSWORD: employee_saas
      POSTGRES_DB: employee_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO is deferred: as of this writing, minio/minio requires an
  # authenticated pull on both Docker Hub and quay.io (MinIO's 2024
  # licensing change), so it isn't included here yet. It goes back in
  # before Step 1.4 (file uploads) - either with a Docker Hub login that
  # has access, or swapped for an S3-compatible alternative (e.g.
  # LocalStack) if that restriction is still in place.

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
